version: "3.9"

# DEV ONLY — NOT FOR PRODUCTION
# Local development compose file for Estathub backend

services:
  backend:
    image: node:20-alpine
    working_dir: /app
    command: ["npm", "run", "dev:ts"]
    ports:
      - "5001:5001"
    env_file:
      - .env.development
    volumes:
      - ./:/app
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: estathub
    ports:
      - "5433:5432"
    volumes:
      - estathub_pg_data:/var/lib/postgresql/data

volumes:
  estathub_pg_data:
